<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fretboard browser checks</title><link rel="stylesheet" href="../style.css"><style>body{display:block;padding:20px;background:#f5f7f9;color:#334155}main{max-width:1600px;margin:auto;min-width:0}h1{font-size:1.3rem}label{display:inline-flex;gap:8px;align-items:center;margin:8px}select,button{min-height:44px}#fixture{max-height:none;padding:12px;border:1px solid #d2d8df;border-radius:12px;background:white;min-width:0}pre{white-space:pre-wrap}#fixture .fretboard-scroll{max-width:100%}</style></head>
<body><main><h1>Fretboard browser checks</h1><p>Synthetic score fixtures. This page changes no app preferences, saved scores or MIDI setup.</p><label>String profile <select id="profile"></select></label><label>Feedback <select id="feedback"><option value="expected">Expected</option><option value="partial" selected>Partial chord and wrong pitch</option><option value="correct">Correct</option><option value="missed">Missed</option></select></label><label><input id="left" type="checkbox">Left-handed</label><button id="run">Run fretboard checks</button><section id="fixture" aria-label="Fixture fretboard"></section><pre id="result" role="status">Loading fixtures…</pre></main><script type="module" src="./fretboard-browser.js"></script></body></html>
